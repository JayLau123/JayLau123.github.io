name: Sync Google Scholar publications

on:
  schedule:
    - cron: '37 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scholar-publications

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Refresh the public Scholar profile snapshot
        run: python3 scripts/sync-scholar-publications.py

      - name: Publish changed metadata
        run: |
          if git diff --quiet -- app/scholar-publications.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/scholar-publications.json
          git commit -m 'Refresh Google Scholar publications'
          git pull --rebase origin main
          git push origin HEAD:main
